server:
  port: 8081

spring:
  application:
    name: certflow-api
  servlet:
    multipart:
      # Template designs embed uploaded images (up to 5 MB each, base64) in the "template" JSON part.
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/certflow}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: certflow-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

certflow:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
    bucket-templates: ${S3_BUCKET_TEMPLATES:certflow-templates}
    bucket-certificates: ${S3_BUCKET_CERTIFICATES:certflow-certificates}
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
    public-verify-url: ${PUBLIC_VERIFY_BASE_URL:http://localhost:5173/verify}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.certflow: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
